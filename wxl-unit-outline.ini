; wxl-unit-outline settings. Placed next to wxl-unit-outline.dll; edits apply within about a quarter
; of a second while the game runs. Values that fail to parse or fall outside their range keep the
; default.
[wxl-unit-outline]

; Master switch. 0 disables the outline entirely.
Enable=1

; Which selections get an outline.
OutlineMouseover=1
OutlineTarget=1

; 1 = also outline the mount a selected unit is riding (or any other model attached below it in the
; unit's model chain). 0 outlines only the unit's own body.
IncludeMount=1

; 1 = never outline your own character, even when it is the mouseover or the target. 0 allows the
; outline on yourself like on any other unit.
HideOnPlayer=1

; 1 = depth-test the silhouette against the world so terrain and buildings hide the outline behind
; them. 0 = always draw the outline, even through world geometry. Defaults to 0 because this
; client's D3D9On12 path rejects the depth-tested stamp at multisampling x1; raise it only if the
; depth path behaves on your build.
Occlusion=0

; Edge width in screen pixels (0.5 - 6.0).
Thickness=1.75

; Edge brightness / accumulation weight (0.5 - 4.0). Higher makes the line brighter and harder.
Intensity=4

; Alpha scale on the outline's alpha (0.0 - 1.0). 1.0 is the default look; lower fades it out.
; This is the level an outline settles at; an outline that has just appeared starts brighter and
; eases down to it over 0.4s (see the fading note in README.md).
Opacity=1.0

; Edge cutoff (0.0 - 0.5). Faint edge pixels below this are dropped; raise it for a crisper, thinner
; line, lower it for a softer one. At 0 nothing is clipped and the Softness roll-off alone decides
; where the line ends.
Threshold=0

; Softness of the edge (0.0 - 0.5). The silhouette is blurred by this before the edge is detected, so
; a pointy model (shoulders, spikes, weapon tips) gets a soft rim instead of a hard aliased one.
; 0 turns the blur off; 0.5 is the most blur the line takes before it stops reading as a line.
Softness=0.225

; Extra brightness multiplier applied only to the mouseover outline, on top of Intensity (0.0 - 4.0).
; 1.0 matches a target outline; higher makes the hovered unit glow brighter, lower dims it.
MouseoverBrightness=1.0

; Reaction colors. Either "R,G,B" with each channel 0-255, or "#RRGGBB".
; Hostile units (reaction 0-1).
ColorHostile=195,0,255
; Neutral units (reaction 2-3).
ColorNeutral=255,255,0
; Friendly units (reaction 4+), and units whose reaction is unknown.
ColorFriendly=0,200,0
; Friendly players (reaction 4+ only): blue, the client's own friendly-player tint, so a player reads
; differently from an NPC. A player you can attack keeps ColorHostile/ColorNeutral.
ColorFriendlyPlayer=70,90,255
; Quest givers the paired server module (mod-mana-quest-outline) reports as having an available or
; turn-in quest for you, and whose quests are not all far below your level. They are outlined always,
; with this color, without being pointed at, and at full strength: a quest giver never fades down to
; the settled opacity the way the mouseover and target outlines do. Only applies while that server
; module is installed and sending; there is no client-side way to know.
ColorQuestGiver=255,209,0
