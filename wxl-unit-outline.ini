; wxl-unit-outline settings. Placed next to wxl-unit-outline.dll; edits apply within a second while
; the game runs. Values that fail to parse or fall outside their range keep the default.
[wxl-unit-outline]

; Master switch. 0 disables the outline entirely.
Enable=1

; Which selections get an outline.
OutlineMouseover=1
OutlineTarget=1

; 1 = also outline the mount a selected unit is riding (or any other model attached below it in the
; unit's model chain). 0 outlines only the unit's own body.
IncludeMount=1

; 1 = depth-test the silhouette against the world so terrain and buildings hide the outline behind
; them. 0 = always draw the outline, even through world geometry. Defaults to 0 because this
; client's D3D9On12 path rejects the depth-tested stamp at multisampling x1; raise it only if the
; depth path behaves on your build.
Occlusion=0

; Edge width in screen pixels (0.5 - 6.0).
Thickness=2.5

; Edge brightness / accumulation weight (0.5 - 4.0). Higher makes the line brighter and harder.
Intensity=1.6

; Opacity scale on the outline's alpha (0.0 - 1.0). 1.0 is the default look; lower fades it out.
Opacity=1.0

; Edge cutoff (0.0 - 0.5). Faint edge pixels below this are dropped; raise it for a crisper, thinner
; line, lower it for a softer one.
Threshold=0.02

; Extra brightness multiplier applied only to the mouseover outline, on top of Intensity (0.0 - 4.0).
; 1.0 matches a target outline; higher makes the hovered unit glow brighter, lower dims it.
MouseoverBrightness=1.0

; Reaction colors. Either "R,G,B" with each channel 0-255, or "#RRGGBB".
; Hostile units (reaction 0-1).
ColorHostile=255,0,0
; Neutral units (reaction 2-3).
ColorNeutral=255,255,0
; Friendly units (reaction 4+), and units whose reaction is unknown.
ColorFriendly=0,255,0
